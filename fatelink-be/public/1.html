<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fb,#0d1220);--panel:light-dark(#fff,#151c2d);--panel2:light-dark(#f0f4fa,#1d273b);--text:light-dark(#172033,#edf2ff);--muted:light-dark(#69758b,#9eabc4);--line:light-dark(#e1e7f0,#2b3650);--brand:light-dark(#635bff,#9b96ff);--brand2:light-dark(#eeedff,#29264f);--green:light-dark(#13865b,#5dd6a2);--orange:light-dark(#b96b15,#ffc16b);--red:light-dark(#c44254,#ff8b9a);--shadow:0 12px 36px #17203312}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.4px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#625bff,#36b9c8);display:grid;place-items:center;color:white;font-weight:900;font-size:19px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase}.top-actions{display:flex;align-items:center;gap:12px}.progress-pill{border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--muted);font-size:13px}.progress-pill b{color:var(--text)}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1440px;margin:auto;min-height:calc(100vh - 70px)}.sidebar{padding:24px 16px;border-right:1px solid var(--line);background:var(--panel)}.side-label{font-size:11px;color:var(--muted);letter-spacing:1.5px;font-weight:800;margin:18px 12px 8px}.navbtn{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:11px 12px;border:0;background:transparent;color:var(--muted);border-radius:11px;margin:3px 0}.navbtn:hover,.navbtn.active{background:var(--brand2);color:var(--brand)}.navbtn .ico{width:22px;text-align:center;font-size:17px}.navbtn .done{margin-left:auto;color:var(--green)}.sidebar-card{margin:26px 4px 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel2)}.sidebar-card strong{display:block;margin-bottom:5px}.sidebar-card p{font-size:12px;color:var(--muted);margin:0 0 12px}.mini-track,.track{height:7px;background:var(--line);border-radius:20px;overflow:hidden}.mini-track span,.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#635bff,#36b9c8);border-radius:20px;transition:width .3s}.main{padding:30px clamp(18px,4vw,54px) 70px;max-width:1150px;width:100%;margin:0 auto}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.8px;font-weight:800;color:var(--brand)}h1{font-size:clamp(30px,4vw,45px);line-height:1.12;letter-spacing:-1.8px;margin:9px 0 13px}h2{font-size:25px;letter-spacing:-.7px;margin:0 0 10px}h3{font-size:18px;margin:0 0 8px}p{margin:0 0 14px}.muted{color:var(--muted)}.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#24254e,#5146bd 60%,#248caa);border-radius:24px;padding:34px;color:white;box-shadow:var(--shadow)}.hero:after{content:"{}";position:absolute;right:4%;top:8%;font-size:130px;font-weight:900;opacity:.09;letter-spacing:-15px}.hero p{max-width:610px;color:#e0e4ff}.hero .eyebrow{color:#aeb5ff}.hero-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 15px;background:var(--panel);color:var(--text);font-weight:700}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.ghost{background:#ffffff16;border-color:#ffffff44;color:white}.btn:disabled{opacity:.4;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 30px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.stat .big{font-size:25px;font-weight:850;letter-spacing:-1px}.stat p{font-size:12px;color:var(--muted);margin:2px 0 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:30px 0 14px}.section-head p{margin:0;color:var(--muted);font-size:13px}.module-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.module{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:17px;cursor:pointer;transition:transform .15s,border .15s}.module:hover{transform:translateY(-2px);border-color:var(--brand)}.module-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.module-icon{height:43px;width:43px;border-radius:13px;display:grid;place-items:center;background:var(--brand2);font-size:21px}.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px}.module h3{margin-bottom:6px}.module p{font-size:13px;color:var(--muted);min-height:42px}.module-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:15px}.module-foot b{color:var(--brand)}.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:22px;align-items:start}.lesson-main{min-width:0}.lesson-aside{position:sticky;top:92px}.breadcrumb{color:var(--muted);font-size:13px;margin-bottom:18px}.lesson-intro{font-size:17px;color:var(--muted);margin-bottom:23px}.content-block{padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:14px 0}.content-block p:last-child{margin-bottom:0}.callout{padding:14px 16px;border-radius:12px;background:var(--brand2);border-left:3px solid var(--brand);margin:16px 0}.callout strong{display:block;margin-bottom:4px}.code{background:#111827;color:#e5e7eb;border-radius:13px;overflow:hidden;margin:14px 0}.codehead{padding:9px 14px;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;color:#aab5cb;font-size:12px}.code pre{margin:0;padding:17px;overflow:auto;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}.code .comment{color:#7dd3a8}.compare{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.compare th,.compare td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.compare th{color:var(--muted);font-weight:700}.lesson-aside .card{padding:17px}.lesson-aside ol{padding-left:20px;color:var(--muted);font-size:13px}.lesson-aside li{padding:5px 0}.lesson-aside li.active{color:var(--brand);font-weight:800}.lesson-controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.quiz-option{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:12px;margin:9px 0;cursor:pointer}.quiz-option:hover{border-color:var(--brand)}.quiz-option input{margin-top:5px;accent-color:var(--brand)}.feedback{padding:13px;border-radius:12px;margin-top:12px}.feedback.good{background:light-dark(#e6f7ef,#16372c);color:var(--green)}.feedback.bad{background:light-dark(#fff0f1,#3b2029);color:var(--red)}.practice-item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.practice-item:last-child{border:0}.practice-item input{width:18px;height:18px;margin-top:4px;accent-color:var(--brand)}.practice-item label{flex:1}.practice-item small{display:block;color:var(--muted);margin-top:3px}.simulator{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sim-box{background:var(--panel2);padding:17px;border-radius:14px;border:1px solid var(--line)}.counter{font-size:46px;font-weight:850;text-align:center;padding:12px}.sim-buttons{display:flex;justify-content:center;gap:8px}.api-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.api-chip{padding:5px 9px;border-radius:7px;background:var(--brand2);color:var(--brand);font-size:12px;font-weight:800}.api-output{font:12px/1.7 ui-monospace,monospace;background:#111827;color:#d5f5df;border-radius:10px;padding:14px;min-height:80px;white-space:pre-wrap;margin-top:12px}.empty{text-align:center;padding:60px 20px}.empty .module-icon{margin:0 auto 14px}.search{width:100%;padding:11px 13px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;outline:none}.search:focus{border-color:var(--brand)}.hidden{display:none!important}.footer-note{font-size:12px;color:var(--muted);text-align:center;margin-top:34px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:6px;overflow:auto;position:sticky;top:70px;z-index:4}.side-label,.sidebar-card{display:none}.navbtn{width:auto;white-space:nowrap;margin:0;padding:9px 12px}.navbtn .done{display:none}.main{padding-top:22px}.lesson-layout{grid-template-columns:1fr}.lesson-aside{position:static;order:-1}.lesson-aside .card{padding:12px}.lesson-aside ol{display:flex;gap:12px;overflow:auto;padding:0;margin:8px 0 0;list-style:none}.lesson-aside li{white-space:nowrap}.lesson-aside .track{margin-top:9px}}
@media(max-width:600px){.topbar{padding:0 14px;height:62px}.brand{font-size:14px}.brand small{font-size:9px}.logo{width:34px;height:34px}.progress-pill{font-size:11px;padding:6px 9px}.layout{min-height:calc(100vh - 62px)}.sidebar{top:62px}.hero{padding:25px 21px}.hero:after{font-size:85px;right:0}.stats{gap:8px}.stat{padding:12px}.stat .big{font-size:20px}.stat p{font-size:10px}.module-grid{grid-template-columns:1fr}.module p{min-height:0}.simulator{grid-template-columns:1fr}.content-block{padding:17px}.section-head{align-items:start;flex-direction:column}h1{letter-spacing:-1px}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">F</div><div>Flutter Learning Lab<small>Learn · Build · Practice</small></div></div><div class="top-actions"><div class="progress-pill">Tiến độ <b id="topProgress">0%</b></div><button class="btn" id="resetBtn" title="Xóa tiến độ học">↻</button></div></header>
<div class="layout"><aside class="sidebar"><div class="side-label">KHÔNG GIAN HỌC</div><button class="navbtn active" data-view="home"><span class="ico">⌂</span>Tổng quan</button><button class="navbtn" data-view="lessons"><span class="ico">▤</span>Bài học</button><button class="navbtn" data-view="practice"><span class="ico">✎</span>Luyện tập</button><button class="navbtn" data-view="quiz"><span class="ico">◉</span>Kiểm tra</button><button class="navbtn" data-view="playground"><span class="ico">▷</span>Phòng thực hành</button><div class="sidebar-card"><strong>🚀 Cứ học từng bước</strong><p>Hoàn thành bài học, làm bài tập và kiểm tra kiến thức của bạn.</p><div class="mini-track"><span id="sideProgress"></span></div><p style="margin-top:8px" id="sideText">0/8 bài học hoàn thành</p></div></aside>
<main class="main" id="main"></main></div></div>
<script>
const lessons=[
{id:'dart',module:'Nền tảng',icon:'⌘',title:'Dart căn bản',time:'35 phút',desc:'Làm quen cú pháp Dart, biến, hàm, class và null safety.',goals:['Khai báo biến với var, final, const','Viết hàm có tham số và giá trị trả về','Hiểu class, constructor và null safety'],theory:`<h3>1. Biến và kiểu dữ liệu</h3><p>Dart là ngôn ngữ Flutter sử dụng. Kiểu dữ liệu giúp bạn biết một biến đang chứa số, chuỗi hay giá trị đúng/sai.</p><div class="code"><div class="codehead"><span>Dart</span><span>Ví dụ</span></div><pre>String name = 'An';
int age = 24;
double salary = 12000000;
bool isActive = true;

var city = 'Hà Nội';       <span class="comment">// Dart tự suy luận kiểu</span>
final createdAt = DateTime.now();
const pi = 3.14159;</pre></div><p><b>var</b> cho phép Dart suy luận kiểu khi khai báo. <b>final</b> chỉ gán một lần khi chạy. <b>const</b> là hằng số được xác định tại thời điểm biên dịch.</p><h3>2. Hàm và class</h3><div class="code"><div class="codehead"><span>Dart</span></div><pre>int add(int a, int b) {
  return a + b;
}

class Employee {
  final String name;
  Employee(this.name);

  void introduce() {
    print('Xin chào, tôi là $name');
  }
}</pre></div><h3>3. Null Safety</h3><p>Mặc định biến kiểu <code>String</code> không nhận <code>null</code>. Dùng <code>String?</code> nếu giá trị có thể chưa tồn tại. Toán tử <code>??</code> cung cấp giá trị mặc định.</p><div class="code"><div class="codehead"><span>Dart</span></div><pre>String? nickname;
String displayName = nickname ?? 'Khách';</pre></div><div class="callout"><strong>Liên hệ với C++</strong><p>Dart cũng có class, hàm và kiểu dữ liệu. Nhưng Dart quản lý null an toàn hơn, hỗ trợ suy luận kiểu, và dùng <code>Future</code>/<code>async</code> cho tác vụ bất đồng bộ.</p></div>`,cpp:`<table class="compare"><tr><th>Dart</th><th>C++ tương đương gần đúng</th></tr><tr><td><code>int age = 20;</code></td><td><code>int age = 20;</code></td></tr><tr><td><code>final name = 'An';</code></td><td><code>const std::string name = "An";</code></td></tr><tr><td><code>String? name;</code></td><td>Có thể hình dung như giá trị tùy chọn, chẳng hạn <code>std::optional</code></td></tr><tr><td><code>class Employee { ... }</code></td><td><code>class Employee { ... };</code></td></tr></table>`},
{id:'flutter',module:'Giao diện',icon:'▣',title:'Flutter & Widget',time:'40 phút',desc:'Xây dựng UI từ Widget, bố cục, sự kiện và điều hướng.',goals:['Phân biệt StatelessWidget và StatefulWidget','Kết hợp Row, Column, Container, ListView','Xử lý nút bấm và nhập liệu'],theory:`<h3>1. Widget là gì?</h3><p>Trong Flutter, gần như mọi thứ trên giao diện đều là Widget: văn bản, nút bấm, khoảng cách, bố cục và cả màn hình. Bạn ghép các Widget nhỏ để tạo giao diện lớn.</p><div class="code"><div class="codehead"><span>Flutter</span></div><pre>class WelcomePage extends StatelessWidget {
  const WelcomePage({super.key});

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Xin chào')),
      body: const Center(
        child: Text('Học Flutter mỗi ngày!'),
      ),
    );
  }
}</pre></div><h3>2. Các Widget bố cục phổ biến</h3><p><code>Row</code> sắp xếp ngang · <code>Column</code> sắp xếp dọc · <code>Stack</code> chồng Widget · <code>ListView</code> tạo danh sách cuộn · <code>Container</code> trang trí, tạo khoảng cách và kích thước.</p><h3>3. Stateless hay Stateful?</h3><div class="callout"><strong>StatelessWidget</strong><p>Hiển thị dựa trên dữ liệu đầu vào, không tự giữ trạng thái có thể thay đổi.</p></div><div class="callout"><strong>StatefulWidget</strong><p>Có State riêng; khi gọi <code>setState(() { ... })</code>, Flutter biết cần dựng lại phần giao diện liên quan.</p></div><p>Hãy bắt đầu bằng một màn hình danh sách, một nút thêm và một ô nhập tên trước khi học thư viện quản lý State.</p>`,cpp:`<table class="compare"><tr><th>Flutter</th><th>Có thể hình dung như</th></tr><tr><td><code>Widget build(...)</code></td><td>Một hàm tạo ra mô tả giao diện</td></tr><tr><td><code>setState()</code></td><td>Báo cho framework cập nhật lại giao diện sau khi dữ liệu đổi</td></tr><tr><td><code>Column(children: [...])</code></td><td>Ghép nhiều phần tử theo trục dọc</td></tr></table>`},
{id:'state',module:'Quản lý dữ liệu',icon:'⟳',title:'State Management & BLoC',time:'45 phút',desc:'Hiểu State, luồng Event → Bloc → State và cập nhật UI.',goals:['Hiểu State và lý do cần quản lý State','Phân biệt setState với BLoC','Nắm Event, State, BlocBuilder'],theory:`<h3>1. State là gì?</h3><p>State là dữ liệu có thể thay đổi trong lúc ứng dụng chạy và ảnh hưởng đến giao diện. Ví dụ: số lượng sản phẩm, danh sách nhân viên, trạng thái loading hoặc thông báo lỗi.</p><div class="code"><div class="codehead"><span>Luồng dữ liệu</span></div><pre>Người dùng bấm nút
       ↓
     Event
       ↓
      Bloc  ← xử lý nghiệp vụ
       ↓
      State
       ↓
  BlocBuilder → cập nhật UI</pre></div><h3>2. Khi nào dùng setState?</h3><p>Phù hợp với trạng thái nhỏ, cục bộ trong một Widget, chẳng hạn bật/tắt mật khẩu hoặc tăng bộ đếm.</p><div class="code"><div class="codehead"><span>Flutter</span></div><pre>int count = 0;

void increment() {
  setState(() {
    count++;
  });
}</pre></div><h3>3. BLoC giúp gì?</h3><p>BLoC tách xử lý nghiệp vụ khỏi giao diện. UI gửi Event, Bloc xử lý và phát State mới. Cách này hữu ích khi tính năng có nhiều trạng thái, cần kiểm thử hoặc kết hợp API.</p><div class="code"><div class="codehead"><span>Ví dụ khái niệm</span></div><pre>Event: LoadEmployees
State: EmployeeLoading
State: EmployeeSuccess(list)
State: EmployeeFailure(message)</pre></div><div class="callout"><strong>Nhớ điểm này</strong><p>Event nói lên điều gì vừa được yêu cầu; State mô tả giao diện nên thể hiện điều gì ở thời điểm hiện tại. Không phải mọi dự án đều cần BLoC cho từng nút bấm nhỏ.</p></div>`,cpp:`<table class="compare"><tr><th>BLoC</th><th>Liên tưởng khi học C++</th></tr><tr><td>Event</td><td>Lệnh hoặc thông điệp yêu cầu xử lý</td></tr><tr><td>Bloc</td><td>Một lớp nhận lệnh, xử lý logic</td></tr><tr><td>State</td><td>Đối tượng biểu diễn kết quả/trạng thái hiện tại</td></tr><tr><td>BlocBuilder</td><td>Phần UI quan sát State và dựng lại khi State đổi</td></tr></table>`},
{id:'api',module:'Kết nối Backend',icon:'⇄',title:'REST API & JSON',time:'50 phút',desc:'Gọi API, đọc JSON, tạo Model và xử lý loading/success/error.',goals:['Phân biệt GET, POST, PUT, DELETE','Hiểu JSON và Model Dart','Thiết kế trạng thái khi gọi API'],theory:`<h3>1. API là cầu nối</h3><p>Ứng dụng gửi HTTP request đến Backend. Backend xử lý rồi trả về HTTP status và dữ liệu, thường ở định dạng JSON.</p><div class="api-row"><span class="api-chip">GET</span><span>Lấy dữ liệu</span><span class="api-chip">POST</span><span>Tạo dữ liệu</span></div><div class="api-row" style="margin-top:8px"><span class="api-chip">PUT/PATCH</span><span>Cập nhật</span><span class="api-chip">DELETE</span><span>Xóa</span></div><h3 style="margin-top:20px">2. JSON thành Model</h3><div class="code"><div class="codehead"><span>JSON mẫu</span></div><pre>{
  "id": 7,
  "name": "Nguyễn An",
  "active": true
}</pre></div><div class="code"><div class="codehead"><span>Dart Model</span></div><pre>class Employee {
  final int id;
  final String name;
  final bool active;

  Employee({required this.id,
    required this.name, required this.active});

  factory Employee.fromJson(Map<String, dynamic> json) {
    return Employee(
      id: json['id'] as int,
      name: json['name'] as String,
      active: json['active'] as bool,
    );
  }
}</pre></div><h3>3. Các trạng thái cần xử lý</h3><p><b>Loading</b>: đang tải · <b>Success</b>: có dữ liệu · <b>Empty</b>: không có dữ liệu · <b>Error</b>: thất bại và có thể thử lại. Không nên để màn hình trắng khi request lỗi.</p><div class="callout"><strong>Trong project thực tế</strong><p>UI → Bloc/Controller → Repository → Dio/API. Repository gom logic truy cập dữ liệu; Model chuyển JSON thành đối tượng Dart dễ sử dụng.</p></div>`,cpp:`<table class="compare"><tr><th>Khái niệm</th><th>Liên hệ gần đúng với C++</th></tr><tr><td>JSON</td><td>Dữ liệu có cấu trúc trao đổi giữa chương trình</td></tr><tr><td>Model</td><td><code>struct</code> hoặc <code>class</code> lưu dữ liệu</td></tr><tr><td>Future</td><td>Kết quả của công việc sẽ hoàn thành trong tương lai; không đồng nhất hoàn toàn với <code>std::future</code></td></tr><tr><td>Repository</td><td>Lớp đóng gói cách lấy/lưu dữ liệu</td></tr></table>`}
];

const tasks=[{id:'t1',title:'Dart: tạo class Employee',detail:'Có name, age và một hàm giới thiệu bản thân.',lesson:'dart'},{id:'t2',title:'Flutter: dựng màn hình danh sách',detail:'Dùng Scaffold, AppBar, ListView và ít nhất 3 dòng dữ liệu.',lesson:'flutter'},{id:'t3',title:'State: làm bộ đếm',detail:'Tạo nút +1 và -1; số hiển thị thay đổi khi bấm.',lesson:'state'},{id:'t4',title:'BLoC: mô tả trạng thái tải',detail:'Viết ra các State Loading, Success và Failure cho danh sách nhân viên.',lesson:'state'},{id:'t5',title:'API: đọc JSON',detail:'Tạo Employee.fromJson và chuyển JSON mẫu thành đối tượng.',lesson:'api'},{id:'t6',title:'API: thiết kế trải nghiệm lỗi',detail:'Mô tả UI khi loading, danh sách rỗng, thành công và lỗi mạng.',lesson:'api'}];
const KEY='flutterLabProgressV1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};saved.lessons=saved.lessons||{};saved.tasks=saved.tasks||{};saved.quiz=saved.quiz||{};let view='home',currentLesson='dart',quizSubmitted=false;
function persist(){localStorage.setItem(KEY,JSON.stringify(saved));renderProgress()};function completed(){return lessons.filter(l=>saved.lessons[l.id]).length};function taskDone(){return tasks.filter(t=>saved.tasks[t.id]).length};function percent(){return Math.round((completed()+taskDone())/(lessons.length+tasks.length)*100)}function renderProgress(){document.getElementById('topProgress').textContent=percent()+'%';document.getElementById('sideProgress').style.width=percent()+'%';document.getElementById('sideText').textContent=completed()+'/'+lessons.length+' bài học · '+taskDone()+'/'+tasks.length+' bài tập';document.querySelectorAll('.navbtn').forEach(b=>{const v=b.dataset.view;b.classList.toggle('active',v===view);});}
function setView(v){view=v;renderProgress();render()};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){return `<div class="hero"><div class="eyebrow">LỘ TRÌNH HỌC TƯƠNG TÁC</div><h1>Từ dòng code đầu tiên<br>đến ứng dụng Flutter.</h1><p>Học lý thuyết ngắn gọn, xem ví dụ, làm bài tập và kiểm tra kiến thức. Đi theo từng bước: Dart → UI → State Management → API.</p><div class="hero-buttons"><button class="btn primary" onclick="openLesson('dart')">▶ Bắt đầu học</button><button class="btn ghost" onclick="setView('playground')">Mở phòng thực hành ↗</button></div></div><div class="stats"><div class="stat"><div class="big">${lessons.length}</div><p>Bài học theo chủ đề</p></div><div class="stat"><div class="big">${taskDone()}/${tasks.length}</div><p>Bài luyện tập hoàn thành</p></div><div class="stat"><div class="big">${percent()}%</div><p>Tiến độ học tập</p></div></div><div class="section-head"><div><h2>Lộ trình của bạn</h2><p>Học theo thứ tự khuyến nghị</p></div><button class="btn" onclick="setView('lessons')">Tất cả bài học →</button></div><div class="module-grid">${lessons.map((l,i)=>moduleCard(l,i)).join('')}</div><div class="section-head"><div><h2>Hôm nay luyện gì?</h2><p>Học xong hãy áp dụng ngay</p></div><button class="btn" onclick="setView('practice')">Mở bài tập →</button></div><div class="card"><h3>🧩 ${tasks.find(t=>!saved.tasks[t.id])?.title||'Bạn đã hoàn thành tất cả bài tập!'}</h3><p class="muted">${tasks.find(t=>!saved.tasks[t.id])?.detail||'Bạn có thể ôn lại bài học hoặc làm bài kiểm tra.'}</p><button class="btn primary" onclick="setView('practice')">Đi tới luyện tập</button></div><div class="footer-note">Tiến độ được lưu trên trình duyệt của bạn. Nội dung học là bản nền tảng, không cần kết nối API thật.</div>`}
function moduleCard(l,i){return `<div class="module" onclick="openLesson('${l.id}')"><div class="module-top"><div class="module-icon">${l.icon}</div><span class="tag">${saved.lessons[l.id]?'✓ Đã hoàn thành':l.time}</span></div><h3>${i+1<10?'0'+(i+1):i+1}. ${l.title}</h3><p>${l.desc}</p><div class="module-foot"><span>${l.module}</span><b>${saved.lessons[l.id]?'Ôn tập lại':'Bắt đầu học →'}</b></div></div>`}
function lessonsPage(){return `<div class="eyebrow">THƯ VIỆN KIẾN THỨC</div><h1>Bài học</h1><p class="lesson-intro">Chọn chủ đề, đọc lý thuyết, xem ví dụ và đánh dấu hoàn thành khi bạn đã hiểu.</p><input class="search" id="lessonSearch" placeholder="⌕  Tìm bài học..." oninput="filterLessons(this.value)"><div class="module-grid" id="lessonGrid" style="margin-top:16px">${lessons.map(moduleCard).join('')}</div>`}
function filterLessons(q){document.querySelectorAll('#lessonGrid .module').forEach((el,i)=>el.classList.toggle('hidden',!(lessons[i].title+' '+lessons[i].desc+' '+lessons[i].module).toLowerCase().includes(q.toLowerCase())))}
function openLesson(id){currentLesson=id;view='lesson';renderProgress();render()}
function lessonPage(){const l=lessons.find(x=>x.id===currentLesson)||lessons[0],idx=lessons.indexOf(l);return `<div class="breadcrumb"><span onclick="setView('home')" style="cursor:pointer">Tổng quan</span> / <span onclick="setView('lessons')" style="cursor:pointer">Bài học</span> / ${l.title}</div><div class="lesson-layout"><div class="lesson-main"><div class="eyebrow">BÀI ${String(idx+1).padStart(2,'0')} · ${l.module.toUpperCase()}</div><h1>${l.title}</h1><p class="lesson-intro">${l.desc}</p><div class="content-block"><h2>🎯 Sau bài này, bạn sẽ</h2>${l.goals.map(g=>`<div class="practice-item"><span style="color:var(--green)">✓</span><label>${g}</label></div>`).join('')}</div><div class="content-block">${l.theory}</div><div class="content-block"><h2>So sánh và ghi nhớ</h2>${l.cpp}</div><div class="content-block"><h2>🧠 Tự kiểm tra nhanh</h2><p class="muted">Bạn có thể giải thích lại các khái niệm mà không nhìn tài liệu không?</p>${l.goals.map((g,i)=>`<div class="practice-item"><input type="checkbox" id="goal${i}" onchange="updateGoalCount()"><label for="goal${i}">${g}</label></div>`).join('')}<p id="goalMsg" class="muted" style="font-size:12px;margin-top:10px">Đánh dấu những mục bạn đã hiểu.</p></div><div class="lesson-controls"><button class="btn" ${idx===0?'disabled':''} onclick="openLesson('${lessons[Math.max(0,idx-1)].id}')">← Bài trước</button><button class="btn primary" onclick="markLesson('${l.id}')">${saved.lessons[l.id]?'✓ Đã hoàn thành':'Đánh dấu hoàn thành ✓'}</button><button class="btn" ${idx===lessons.length-1?'disabled':''} onclick="openLesson('${lessons[Math.min(lessons.length-1,idx+1)].id}')">Bài tiếp →</button></div></div><aside class="lesson-aside"><div class="card"><b>Nội dung khóa học</b><div class="track" style="margin-top:12px"><span style="width:${completed()/lessons.length*100}%"></span></div><ol>${lessons.map((x,i)=>`<li class="${x.id===l.id?'active':''}" onclick="openLesson('${x.id}')" style="cursor:pointer">${saved.lessons[x.id]?'✓ ':''}${i+1}. ${x.title}</li>`).join('')}</ol><div style="border-top:1px solid var(--line);padding-top:13px;margin-top:12px;font-size:12px;color:var(--muted)">⏱ ${l.time}<br>📚 ${l.goals.length} mục tiêu</div></div></aside></div>`}
function updateGoalCount(){const n=[...document.querySelectorAll('[id^=goal]')].filter(e=>e.type==='checkbox'&&e.checked).length;const m=document.getElementById('goalMsg');if(m)m.textContent=`Đã tự đánh giá ${n}/${lessons.find(l=>l.id===currentLesson).goals.length} mục tiêu.`}
function markLesson(id){saved.lessons[id]=true;persist();render()}
function practicePage(){return `<div class="eyebrow">HỌC QUA THỰC HÀNH</div><h1>Bài tập & luyện tập</h1><p class="lesson-intro">Đánh dấu bài tập khi bạn đã tự làm. Hãy thử trước khi xem lại phần lý thuyết.</p><div class="card"><div class="section-head" style="margin:0 0 8px"><div><h3>Tiến độ bài tập</h3><p>${taskDone()} trên ${tasks.length} bài đã hoàn thành</p></div><b style="color:var(--brand)">${Math.round(taskDone()/tasks.length*100)}%</b></div><div class="track"><span style="width:${taskDone()/tasks.length*100}%"></span></div></div><div class="content-block"><h2>Danh sách bài tập</h2>${tasks.map((t,i)=>`<div class="practice-item"><input id="${t.id}" type="checkbox" ${saved.tasks[t.id]?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><label for="${t.id}"><b>${i+1}. ${t.title}</b><small>${t.detail}</small><small>Chủ đề: ${lessons.find(l=>l.id===t.lesson).title}</small></label><button class="btn" onclick="openLesson('${t.lesson}')">Ôn bài ↗</button></div>`).join('')}</div><div class="content-block"><h2>💡 Cách luyện tập hiệu quả</h2><p>1. Đọc đề và tự viết lời giải trước.</p><p>2. Chạy thử trong project Flutter của bạn, nếu có thể.</p><p>3. Đọc lại lý thuyết để hiểu nguyên nhân, không chỉ ghi nhớ đáp án.</p><p>4. Khi xong, đánh dấu hoàn thành để theo dõi tiến độ.</p></div>`}
function toggleTask(id,v){saved.tasks[id]=v;persist();render()}
function quizPage(){return `<div class="eyebrow">ÔN TẬP KIẾN THỨC</div><h1>Kiểm tra nhanh</h1><p class="lesson-intro">6 câu hỏi nền tảng về Dart, Flutter, State Management và API. Chọn một đáp án cho mỗi câu.</p><div class="card"><div class="section-head" style="margin-top:0"><div><h3>Bài kiểm tra tổng hợp</h3><p>Không giới hạn thời gian · Có giải thích đáp án</p></div><span class="tag">${quiz.length} câu</span></div><form id="quizForm">${quiz.map((q,i)=>`<div class="content-block"><h3>Câu ${i+1}. ${q.q}</h3>${q.opts.map((o,j)=>`<label class="quiz-option"><input type="radio" name="q${i}" value="${j}" ${saved.quiz['q'+i]===j?'checked':''}><span>${o}</span></label>`).join('')}<div id="feedback${i}"></div></div>`).join('')}<button class="btn primary" type="submit">Chấm điểm bài làm</button> <button class="btn" type="button" onclick="resetQuiz()">Làm lại</button></form><div id="quizResult" style="margin-top:16px"></div></div>`}
function gradeQuiz(e){e.preventDefault();let score=0;quiz.forEach((q,i)=>{const picked=document.querySelector(`input[name=q${i}]:checked`);const val=picked?Number(picked.value):-1;saved.quiz['q'+i]=val;if(val===q.a)score++;const fb=document.getElementById('feedback'+i);fb.className='feedback '+(val===q.a?'good':'bad');fb.textContent=(val===q.a?'✓ Chính xác. ':'✕ Chưa đúng. ')+q.why;});persist();document.getElementById('quizResult').innerHTML=`<div class="callout"><strong>Kết quả: ${score}/${quiz.length} câu đúng (${Math.round(score/quiz.length*100)}%)</strong><p>${score>=5?'Rất tốt! Bạn đã nắm được nhiều kiến thức nền tảng.':score>=3?'Khá ổn! Hãy xem phần giải thích và ôn lại các bài liên quan.':'Đừng lo. Hãy ôn bài học rồi thử lại nhé.'}</p></div>`;quizSubmitted=true}
function resetQuiz(){saved.quiz={};persist();quizSubmitted=false;render()}
function playground(){return `<div class="eyebrow">THỬ NGAY TRÊN TRANG</div><h1>Phòng thực hành</h1><p class="lesson-intro">Một số mô phỏng nhỏ giúp bạn hiểu tư duy State và vòng đời gọi API. Đây là mô phỏng tương tác, không chạy Dart hoặc gọi Backend thật.</p><div class="content-block"><h2>01 · Mô phỏng State với bộ đếm</h2><p>Thay đổi State rồi quan sát giao diện cập nhật ngay. Đây là ý tưởng cốt lõi phía sau <code>setState()</code>.</p><div class="simulator"><div class="sim-box"><div class="muted" style="text-align:center">State hiện tại · count</div><div class="counter" id="counterValue">0</div><div class="sim-buttons"><button class="btn" onclick="changeCount(-1)">− Giảm</button><button class="btn primary" onclick="changeCount(1)">+ Tăng</button><button class="btn" onclick="changeCount(0)">Reset</button></div></div><div class="sim-box"><b>Điều đang xảy ra</b><p class="muted" style="font-size:13px;margin-top:8px" id="counterExplain">State ban đầu là 0. Hãy bấm Tăng hoặc Giảm.</p><div class="code" style="margin-bottom:0"><div class="codehead"><span>Ý tưởng Flutter</span></div><pre>setState(() {
  count += 1;
});</pre></div></div></div></div><div class="content-block"><h2>02 · Mô phỏng vòng đời API</h2><p>Chọn hành động để xem UI thường phản hồi ra sao trong từng trạng thái.</p><div class="api-row"><button class="btn" onclick="apiDemo('loading')">Gửi request</button><button class="btn" onclick="apiDemo('success')">Giả lập thành công</button><button class="btn" onclick="apiDemo('empty')">Giả lập rỗng</button><button class="btn" onclick="apiDemo('error')">Giả lập lỗi</button></div><div id="apiState" class="api-output">State: idle\nSẵn sàng gửi request.</div><div class="callout"><strong>Trong ứng dụng thật</strong><p>Thay mô phỏng bằng Dio/HTTP, chuyển response thành Model, rồi phát State tương ứng từ Bloc hoặc cập nhật Controller.</p></div></div><div class="content-block"><h2>03 · Tự kiểm tra luồng BLoC</h2><p>Nhấn từng bước theo thứ tự và xem sơ đồ hình thành.</p><div class="api-row"><button class="btn" onclick="blocStep(0)">1. Bấm tải</button><button class="btn" onclick="blocStep(1)">2. Bloc xử lý</button><button class="btn" onclick="blocStep(2)">3. Phát State</button><button class="btn" onclick="blocStep(3)">4. UI cập nhật</button></div><div id="blocOutput" class="api-output">Event: chưa có\nBloc: đang chờ</div></div>`}
function changeCount(d){let n=Number(document.getElementById('counterValue').textContent);n=d===0?0:n+d;document.getElementById('counterValue').textContent=n;document.getElementById('counterExplain').textContent=d===0?'Đưa State về giá trị ban đầu: 0.':`State thay đổi thành ${n}. Trong Flutter, setState báo cho framework dựng lại Widget để hiển thị giá trị mới.`}
function apiDemo(s){const out=document.getElementById('apiState');const map={loading:'State: loading\nĐang gửi request...\nUI: hiển thị progress indicator.',success:'State: success\nHTTP 200 OK\nData: [{"id": 7, "name": "Nguyễn An"}]\nUI: hiển thị danh sách nhân viên.',empty:'State: empty\nHTTP 200 OK\nData: []\nUI: thông báo Chưa có dữ liệu.',error:'State: error\nRequest thất bại (ví dụ mất kết nối).\nUI: hiển thị thông báo lỗi và nút Thử lại.'};out.textContent=map[s]}
function blocStep(i){const a=['Event: LoadEmployees\nBloc nhận yêu cầu tải danh sách.','Event: LoadEmployees\nBloc gọi Repository → Repository gọi API.','State: EmployeeLoading → EmployeeSuccess(list)\nhoặc EmployeeFailure(message).','BlocBuilder nhận State mới và dựng lại phần UI tương ứng.'];document.getElementById('blocOutput').textContent=a[i]}
function render(){const m=document.getElementById('main');if(view==='home')m.innerHTML=home();else if(view==='lessons')m.innerHTML=lessonsPage();else if(view==='lesson')m.innerHTML=lessonPage();else if(view==='practice')m.innerHTML=practicePage();else if(view==='quiz'){m.innerHTML=quizPage();document.getElementById('quizForm').addEventListener('submit',gradeQuiz)}else if(view==='playground')m.innerHTML=playground();renderProgress()}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('Bạn muốn xóa toàn bộ tiến độ học đã lưu trên trình duyệt này?')){saved={lessons:{},tasks:{},quiz:{}};persist();setView('home')}});render();
</script></body></html>
